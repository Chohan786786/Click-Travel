<style>
:root{--bg:#F4F9FC;--bg2:#E6F1F8;--tx:#0E2A47;--mut:#4F6B84;--card:#fff;--bd:#CFE0EC;--pri:#0E2A47;--on:#fff;--sky:#2E9BD6;--acc:#FF8A1F;--sh:0 10px 30px -12px rgba(14,42,71,.25)}
[data-theme=dark]{--bg:#081522;--bg2:#0D2033;--tx:#EAF3FA;--mut:#9DB5C9;--card:#102A41;--bd:#1E3B55;--pri:#2E9BD6;--on:#05111C;--sky:#5BB8EA;--acc:#FF9B3D;--sh:0 10px 30px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--tx);font:400 1rem/1.65 'Plus Jakarta Sans',system-ui,sans-serif;transition:background .3s,color .3s}
[dir=rtl] body{font-family:'Noto Naskh Arabic','Plus Jakarta Sans',serif;line-height:2}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;line-height:1.15}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:'Noto Nastaliq Urdu',serif;line-height:1.9}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
a{color:inherit}
.w{width:min(1120px,92%);margin-inline:auto}
section{padding:72px 0}
.alt{background:var(--bg2)}
h2{font-size:clamp(1.7rem,4vw,2.4rem);margin-bottom:12px}
.lead{color:var(--mut);max-width:60ch;margin-bottom:32px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;border:2px solid transparent;font:600 1rem inherit;cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.b1{background:var(--acc);color:#1b1000}
.b2{border-color:var(--tx);background:transparent;color:var(--tx)}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font:800 1.45rem 'Bricolage Grotesque';margin-inline-end:auto}
.logo img{width:40px;height:40px;display:block}
.wm{letter-spacing:-.01em;direction:ltr;unicode-bidi:isolate}.wm b{color:#506074;font-weight:800}.wm em{color:#1AB0EE;font-style:normal;font-weight:800}
[data-theme=dark] .wm b{color:#DCE6EF}footer .wm b{color:#fff}
.links{display:flex;gap:20px}
.links a{text-decoration:none;font-weight:600;color:var(--mut)}
.links a:hover{color:var(--tx)}
.ib{min-width:44px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 .95rem inherit;cursor:pointer}
#menu{display:none}
.hero{padding:56px 0 80px;background:radial-gradient(900px 400px at 85% -10%,color-mix(in srgb,var(--sky) 28%,transparent),transparent)}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(2.2rem,5.5vw,3.9rem);letter-spacing:-.02em;margin-bottom:16px}
.hero p{color:var(--mut);font-size:1.1rem;max-width:48ch;margin-bottom:26px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.pass{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.pass h3{background:var(--pri);color:var(--on);padding:14px 22px;font-size:1.05rem}
.pass form{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pass .f{grid-column:1/-1;border-top:2px dashed var(--bd);padding-top:12px}
label{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--mut)}
input{padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px}
.card .ic{font-size:1.8rem;display:block;margin-bottom:8px}
.card h3{font-size:1.15rem;margin-bottom:6px}
.card p{color:var(--mut);font-size:.95rem}
.dest{min-height:190px;border-radius:16px;padding:20px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;box-shadow:var(--sh)}
.dest h3{font-size:1.4rem}
.dest .btn{align-self:flex-start;padding:8px 16px;background:#fff;color:#0E2A47}
.steps{counter-reset:s}
.steps .card::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#1b1000;font-weight:800;margin-bottom:10px}
blockquote{font-size:.98rem}
blockquote b{display:block;margin-top:10px;color:var(--sky)}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;margin-bottom:10px}
summary{font-weight:600;cursor:pointer}
details p{color:var(--mut);margin-top:8px}
.cg{display:grid;grid-template-columns:1fr 1.2fr;gap:28px}
.cg ul{list-style:none;padding:0;display:grid;gap:14px;margin-bottom:20px}
iframe{width:100%;min-height:340px;border:0;border-radius:16px;background:var(--bg2)}
footer{background:var(--pri);color:var(--on);padding:36px 0;font-size:.92rem}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{margin-inline-end:14px}
.wa{position:fixed;inset-block-end:18px;inset-inline-end:18px;z-index:30;width:56px;height:56px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.35);text-decoration:none;font-size:1.6rem}
@media(max-width:860px){.hg,.cg{grid-template-columns:1fr}#menu{display:block}.links{display:none;position:absolute;inset-inline:0;top:68px;background:var(--bg);flex-direction:column;padding:16px 4%;border-bottom:1px solid var(--bd)}.links.open{display:flex}.nav .b1{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

const wa=t=>`https://wa.me/${PH}?text=${encodeURIComponent(t)}`;
let L=R.lang==='ur'?'ur':'en';
function render(){
 const t=T[L];R.lang=L;R.dir=L==='ur'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t[e.dataset.i]);
 $('#lang').textContent=L==='en'?'اردو':'EN';
 $('#svc').innerHTML=t.svc.map(s=>`<div class="card"><span class="ic">${s[0]}</span><h3>${s[1]}</h3><p>${s[2]}</p></div>`).join('');
 $('#dst').innerHTML=t.dest.map((n,i)=>`<div class="dest" style="background:linear-gradient(150deg,${C[i]})"><h3>${n}</h3><a class="btn" target="_blank" rel="noopener" href="${wa(t.dm(n))}">${t.price}</a></div>`).join('');
 $('#why-l').innerHTML=t.why.map(s=>`<div class="card"><span class="ic">${s[0]}</span><h3>${s[1]}</h3><p>${s[2]}</p></div>`).join('');
 $('#stp').innerHTML=t.stp.map(s=>`<div class="card"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('');
 $('#rev').innerHTML=t.rev.map(s=>`<div class="card"><blockquote>${s[0]}<b>${s[1]}</b></blockquote></div>`).join('');
 $('#faq').innerHTML=t.faq.map(s=>`<details><summary>${s[0]}</summary><p>${s[1]}</p></details>`).join('');
 ['#wa0','#wa1','#wa2','#wa3'].forEach(i=>$(i).href=wa(t.gen));
 document.title=L==='en'?'ClickTravel | Cheapest Air Tickets & Gilgit–Skardu Tours, Sargodha':'کلک ٹریول | سستی ہوائی ٹکٹ اور گلگت و سکردو ٹورز، سرگودھا';
 document.querySelector('meta[name=description]').content=t.sub;
 try{localStorage.setItem('ctp-lang',L)}catch(e){}
}
function theme(n){R.dataset.theme=n;$('#theme').textContent=n==='dark'?'☀':'🌙';try{localStorage.setItem('ctp-theme',n)}catch(e){}}
